<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Hexagon Puzzle</title>
<style>
  :root{
    --bg:#1b1d24; --panel:#242730; --panel2:#2c3039;
    --ink:#eef1f6; --muted:#9aa3b2; --accent:#f0a020; --good:#57c785; --bad:#e5533c;
    --line:#3a3f4b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #app{display:flex;flex-direction:column;height:100%;}
  header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);
    border-bottom:1px solid var(--line);flex-wrap:wrap;}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px;}
  header .sub{color:var(--muted);font-size:12px;}
  .spacer{flex:1;}
  .btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;
    transition:background .15s,border-color .15s;user-select:none;white-space:nowrap;}
  .btn:hover{background:#333844;border-color:#4a505e;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent);color:#20160a;border-color:var(--accent);}
  .btn.primary:hover{background:#ffb733;}
  .pill{color:var(--muted);font-size:12px;padding:6px 10px;background:var(--panel2);
    border-radius:20px;border:1px solid var(--line);}
  .pill b{color:var(--ink);}
  #stage{flex:1;position:relative;min-height:0;min-width:0;}
  canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;}
  .hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    background:rgba(20,22,28,.82);border:1px solid var(--line);border-radius:10px;
    padding:8px 14px;font-size:12.5px;color:var(--muted);pointer-events:none;
    display:flex;gap:16px;white-space:nowrap;backdrop-filter:blur(4px);}
  .hint kbd{background:#3a3f4b;border-radius:4px;padding:1px 6px;color:var(--ink);
    font-family:inherit;font-size:11px;font-weight:700;}
  #win{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(15,17,22,.72);backdrop-filter:blur(3px);z-index:5;}
  #win .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:30px 40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  #win h2{margin:0 0 6px;font-size:28px;}
  #win p{margin:0 0 18px;color:var(--muted);}
  /* solution badge */
  .badge{background:linear-gradient(135deg,#2c3140,#20232c);border:1px solid var(--line);
    border-radius:14px;padding:14px 20px;margin:4px 0 16px;display:inline-block;min-width:240px;}
  .badge .lab{font-size:12px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
  .badge .num{font-size:30px;font-weight:800;color:var(--accent);line-height:1.1;margin:2px 0;}
  .badge .num small{font-size:15px;color:var(--muted);font-weight:600;}
  .badge .tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .badge .tag.new{background:#1e3a2a;color:var(--good);}
  .badge .tag.old{background:#3a3320;color:#e0b050;}
  /* solution naming */
  #nameBox{margin:2px 0 14px;}
  #approvedName{font-size:15px;color:var(--ink);}
  #approvedName b{color:var(--accent);font-size:19px;}
  #nameSubmit{display:flex;flex-direction:column;gap:8px;align-items:center;}
  #nameSubmit .row{display:flex;gap:8px;justify-content:center;}
  #nameInput{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font-size:14px;width:200px;font-family:inherit;}
  #nameInput:focus{outline:none;border-color:var(--accent);}
  #nameMsg{font-size:12px;color:var(--muted);min-height:15px;}
  #nameMsg.ok{color:var(--good);}
  .sol .sname{color:var(--accent);font-weight:700;font-size:12px;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* collection modal */
  #collection{position:absolute;inset:0;display:none;flex-direction:column;z-index:6;
    background:rgba(12,14,18,.9);backdrop-filter:blur(4px);}
  #collection .top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);}
  #collection h2{margin:0;font-size:18px;}
  #collection .top .sub{color:var(--muted);font-size:13px;}
  #gallery{flex:1;overflow-y:auto;padding:16px;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;align-content:start;}
  .sol{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;}
  .sol canvas{width:100%;height:auto;display:block;border-radius:6px;}
  .sol .sn{font-weight:800;color:var(--accent);font-size:15px;margin-top:6px;}
  .sol .sd{color:var(--muted);font-size:11px;}
  #gallery .empty{color:var(--muted);grid-column:1/-1;text-align:center;padding:40px;}
  @media (max-width:640px){ header h1{font-size:14px;} .hint{display:none;} .btn{padding:6px 9px;font-size:12px;} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>⬡ Hexagon Puzzle</h1>
    <span class="sub">fit every piece into the hexagon</span>
    <span class="spacer"></span>
    <span class="pill">Placed <b id="count">0</b>/<b id="total">0</b></span>
    <button class="btn" id="rotL" title="Rotate left">⟲</button>
    <button class="btn" id="rotR" title="Rotate right">⟳</button>
    <button class="btn" id="shuffle">Shuffle</button>
    <button class="btn" id="reset">Reset</button>
    <button class="btn" id="solve">Solve</button>
    <button class="btn" id="solutions">🏅 My Solutions (<b id="solCount">0</b>)</button>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="hint">
      <span><kbd>drag</kbd> move piece</span>
      <span><kbd>tap</kbd> / <kbd>R</kbd> / <kbd>right-click</kbd> rotate</span>
      <span><kbd>double-click</kbd> flip</span>
      <span><kbd>drag ring</kbd> turn board</span>
      <span>overlaps flash <span style="color:#ff5a44">red</span></span>
    </div>
    <div id="win"><div class="card">
      <h2>🎉 Solved!</h2>
      <div class="badge" id="badge"></div>
      <div id="nameBox">
        <div id="approvedName"></div>
        <div id="nameSubmit">
          <div class="row">
            <input id="nameInput" maxlength="40" placeholder="Name this solution…" />
            <button class="btn primary" id="submitName">Submit for approval</button>
          </div>
          <div id="nameMsg"></div>
        </div>
      </div>
      <p id="wintime">Nicely done.</p>
      <button class="btn primary" id="again">Play again</button>
      <button class="btn" id="viewAll">View my solutions</button>
    </div></div>
    <div id="collection">
      <div class="top">
        <h2>🏅 My Solutions</h2>
        <span class="sub" id="colSub"></span>
        <span class="spacer" style="flex:1"></span>
        <button class="btn" id="colClose">Close</button>
      </div>
      <div id="gallery"></div>
    </div>
  </div>
</div>

<script>
const PIECE_DATA = [{"id":"P0","color":"#F20C0C","solution":[[2,0],[3,-1],[3,0],[3,1],[4,0]]},{"id":"P1","color":"#0000FF","solution":[[0,-4],[0,-3],[1,-4],[1,-3],[1,-2]]},{"id":"P2","color":"#00FF00","solution":[[2,-1],[3,-2],[4,-2],[4,-1]]},{"id":"P3","color":"#0CC4F2","solution":[[-4,0],[-4,1],[-4,2],[-4,3]]},{"id":"P4","color":"#F20CAD","solution":[[-2,-2],[-2,-1],[-2,0],[-1,0],[0,-1]]},{"id":"P5","color":"#FFD632","solution":[[0,1],[0,2],[1,0],[1,1],[1,2]]},{"id":"P6","color":"#0CF2AD","solution":[[-4,4],[-3,3],[-3,4]]},{"id":"P7","color":"#327AFF","solution":[[-3,-1],[-3,0],[-3,1],[-2,1]]},{"id":"P8","color":"#E500FF","solution":[[-3,2],[-2,2],[-2,3],[-1,1]]},{"id":"P9","color":"#F43D6B","solution":[[0,4],[1,3],[2,1],[2,2]]},{"id":"P10","color":"#CBFF00","solution":[[3,-4],[3,-3],[4,-4],[4,-3]]},{"id":"P11","color":"#FF8E32","solution":[[-2,4],[-1,2],[-1,3],[-1,4],[0,3]]},{"id":"P12","color":"#00FEFF","solution":[[0,0],[1,-1],[2,-4],[2,-3],[2,-2]]},{"id":"P13","color":"#3D46F4","solution":[[-1,-3],[-1,-2],[-1,-1],[0,-2]]}];
const BOARD_RADIUS = 4;

/* ---------- community solution names (GitHub-backed) ---------- */
const GH_OWNER='donkeyeatsbacon-web', GH_REPO='hexagon-game', SUBMISSION_LABEL='name-submission';
let approvedNames = {};                 // { solutionId: {name, num, approvedAt} }
async function loadApprovedNames(){
  try{
    const r = await fetch('approved-names.json?_='+Date.now(), {cache:'no-store'});
    if(r.ok) approvedNames = await r.json();
  }catch(e){ /* offline / not published yet — names just won't show */ }
}
// open a pre-filled GitHub issue as a submission for owner approval
function submitNameForApproval(id, num, name, layout){
  const payload = {id, num, name, layout};
  const title = 'Name #'+num+': '+name;
  const body = 'A player proposed a name for a hexagon solution. Approve it in the admin page.\n\n'+
               '```json\n'+JSON.stringify(payload)+'\n```\n';
  const url = 'https://github.com/'+GH_OWNER+'/'+GH_REPO+'/issues/new'+
              '?labels='+encodeURIComponent(SUBMISSION_LABEL)+
              '&title='+encodeURIComponent(title)+
              '&body='+encodeURIComponent(body);
  window.open(url, '_blank', 'noopener');
}

/* ---------- hex math (pointy-top, axial q,r ; cube x=q, z=r, y=-x-z) ---------- */
const SQRT3 = Math.sqrt(3);
function axialToPixel(q, r, size){ return { x: size*SQRT3*(q + r/2), y: size*1.5*r }; }
function pixelToAxial(x, y, size){
  const q = (SQRT3/3 * x - 1/3 * y) / size;
  const r = (2/3 * y) / size;
  return hexRound(q, r);
}
function hexRound(q, r){
  let x=q, z=r, y=-x-z;
  let rx=Math.round(x), ry=Math.round(y), rz=Math.round(z);
  const dx=Math.abs(rx-x), dy=Math.abs(ry-y), dz=Math.abs(rz-z);
  if(dx>dy && dx>dz) rx=-ry-rz; else if(dy>dz) ry=-rx-rz; else rz=-rx-ry;
  return { q: rx, r: rz };
}
// transforms on a cell offset [q,r]
function rot60(cell){ // 60 deg clockwise: (x,y,z)->(-z,-x,-y)
  const x=cell[0], z=cell[1], y=-x-z;
  const nx=-z, nz=-y; // ny=-x
  return [nx, nz];
}
function reflect(cell){ // swap x<->z : (q,r)->(r,q)
  return [cell[1], cell[0]];
}
function transformCells(base, rot, flip){
  return base.map(c=>{
    let cell = flip ? reflect(c) : [c[0], c[1]];
    for(let i=0;i<rot;i++) cell = rot60(cell);
    return cell;
  });
}

/* ---------- board cells ---------- */
const boardCells = [];
const boardSet = new Set();
for(let q=-BOARD_RADIUS;q<=BOARD_RADIUS;q++)
  for(let r=-BOARD_RADIUS;r<=BOARD_RADIUS;r++)
    if(Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))<=BOARD_RADIUS){
      boardCells.push([q,r]); boardSet.add(q+","+r);
    }

/* ---------- game state ---------- */
let pieces = [];        // {id,color,base,rot,flip,placed,anchor:{q,r}|null,tray:{x,y}}
let cover = new Map();  // "q,r" -> [piece indices covering this cell] (overlaps allowed)
let overlapCells = new Set(); // cells covered by 2+ pieces -> flash red
let flashRAF = null;    // requestAnimationFrame handle for the overlap flash
let drag = null;        // {idx, mx,my, moved, ...}
let lastTap = null;     // {t,idx} last no-move tap, for double-click(-tap) flip detection
let boardAngle = 0;     // whole-board rotation (radians), turned via the grip ring
let boardDrag = null;   // {lastAng} while turning the board by its border ring
let selected = -1;
let startTime = null, solvedFlag = false;

function makePieces(){
  pieces = PIECE_DATA.map(p=>({
    id:p.id, color:p.color, base:p.solution.map(c=>[c[0],c[1]]),
    rot:0, flip:false, placed:false, anchor:null, tray:{x:0,y:0}
  }));
  cover.clear(); overlapCells.clear();
}
// cells of a piece given its current orientation, anchored so cell[0] sits at `anchor`
function orientedOffsets(p){
  const t = transformCells(p.base, p.rot, p.flip);
  const o = t[0];
  return t.map(c=>[c[0]-o[0], c[1]-o[1]]); // first cell at (0,0)
}
function placedCells(p){
  const offs = orientedOffsets(p);
  return offs.map(o=>[p.anchor.q+o[0], p.anchor.r+o[1]]);
}

/* ---------- layout ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let DPR=1, W=0, H=0;
let boardSize=30, boardOx=0, boardOy=0;   // board hex size + pixel origin (center)
let boardCircumR=0, borderInner=0, borderOuter=0;  // board circumradius + grip-ring radii (px)
let traySize=18;                           // scattered-piece hex size

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // board centered; leave a margin ring around it for the scattered pieces
  boardOx = W/2; boardOy = H/2;
  const D = Math.min(W,H)*0.56;   // hexagon fits inside a centered box of side D
  boardSize = Math.max(8, Math.min(D/(SQRT3*(2*BOARD_RADIUS+1)), D/(3*BOARD_RADIUS+2)));
  boardCircumR = 0;
  for(const [q,r] of boardCells){ const p=axialToPixel(q,r,boardSize); boardCircumR=Math.max(boardCircumR,Math.hypot(p.x,p.y)); }
  boardCircumR += boardSize;      // include hex extent
  borderInner = boardCircumR + Math.max(5, boardSize*0.30);   // grip ring hugs the board
  borderOuter = borderInner + Math.max(14, boardSize*0.85);
  layoutTray();
  draw();
}

// max bounding box of a piece over ALL 12 orientations, at hex size 1
function pieceExtentAll(p){
  let mw=1, mh=1;
  for(let rot=0;rot<6;rot++){
    const t=transformCells(p.base,rot,false);
    const o0=t[0]; let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    for(const c of t){
      const px=axialToPixel(c[0]-o0[0],c[1]-o0[1],1);
      minx=Math.min(minx,px.x-1); maxx=Math.max(maxx,px.x+1);
      miny=Math.min(miny,px.y-SQRT3/2); maxy=Math.max(maxy,px.y+SQRT3/2);
    }
    mw=Math.max(mw,maxx-minx); mh=Math.max(mh,maxy-miny);
  }
  return {w:mw,h:mh};
}

// Scatter the pieces in a compact cluster HUGGING the board (concentric rings just
// outside it), rather than spread to the far canvas edges. On a wide screen this keeps
// everything within ~min(W,H) of centre, leaving the sides empty instead of stretching
// the layout across the whole width. Deterministic per-index jitter gives a scattered
// (non-perfect-circle) look while keeping slots stable so pieces don't jump around.
function layoutTray(){
  const N = pieces.length;
  let maxExt=1;
  for(const p of pieces){ const e=pieceExtentAll(p); maxExt=Math.max(maxExt,e.w,e.h); }
  const Rmax = Math.min(W,H)/2 - 6;           // binding dimension keeps pieces on-screen
  let chosen=null;
  for(let size=Math.max(6,boardSize); size>=4; size*=0.9){
    const slot = maxExt*size + size*0.5;      // per-piece footprint diameter
    const r0   = borderOuter + slot*0.5 + 4;  // first ring sits just outside the grip border
    const rowH = slot*0.88;
    const rings=[]; let cap=0;
    for(let r=r0; r+slot*0.5<=Rmax; r+=rowH){
      const per=Math.max(1, Math.floor((2*Math.PI*r)/slot));
      rings.push({r,per}); cap+=per;
      if(cap>=N) break;
    }
    if(cap>=N){ chosen={size,slot,rings}; break; }
  }
  if(!chosen){ const size=4, slot=maxExt*size+size*0.5;
    chosen={size,slot,rings:[{r:borderOuter+slot*0.5+4, per:N}]}; }
  traySize=chosen.size;
  let i=0;
  chosen.rings.forEach((ring,ri)=>{
    const per=Math.min(ring.per, N-i);
    const spread=ring.per;
    const base=ri*0.65;                       // offset each ring so slots don't line up
    for(let k=0;k<per && i<N;k++,i++){
      const p=pieces[i];
      const h =((i*2654435761)>>>0)/4294967296;      // deterministic 0..1
      const h2=((i*40503+12345)>>>0)/4294967296;
      const ang = base + (k+0.5)/spread*2*Math.PI + (h-0.5)*(2*Math.PI/spread)*0.6;
      const rr  = ring.r + (h2-0.5)*chosen.slot*0.35;
      const cx=boardOx + rr*Math.cos(ang), cy=boardOy + rr*Math.sin(ang);
      const bb=pieceBBox(p,traySize);
      p.tray.x = cx - (bb.minx+bb.maxx)/2;
      p.tray.y = cy - (bb.miny+bb.maxy)/2;
    }
  });
}
function pieceBBox(p, size){
  const offs = orientedOffsets(p);
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const o of offs){
    const c = axialToPixel(o[0],o[1],size);
    minx=Math.min(minx,c.x-size); maxx=Math.max(maxx,c.x+size);
    miny=Math.min(miny,c.y-size*SQRT3/2); maxy=Math.max(maxy,c.y+size*SQRT3/2);
  }
  return {minx,miny,maxx,maxy,w:maxx-minx,h:maxy-miny};
}

/* ---------- drawing ---------- */
function hexPath(cx, cy, size){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a = Math.PI/180*(30+60*i); // pointy-top
    const x=cx+size*Math.cos(a), y=cy+size*Math.sin(a);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
}
function drawCellHex(cx,cy,size,fill,stroke,lw){
  hexPath(cx,cy,size*0.96);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.lineWidth=lw||1.5; ctx.strokeStyle=stroke; ctx.stroke(); }
}
function shade(hex, amt){ // amt -1..1 darken/lighten
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const f=amt<0?0:255, t=Math.abs(amt);
  r=Math.round(r+(f-r)*t); g=Math.round(g+(f-g)*t); b=Math.round(b+(f-b)*t);
  return `rgb(${r},${g},${b})`;
}
function drawPieceHexes(cells, cx, cy, size, color, alpha, highlight){
  ctx.save();
  ctx.globalAlpha = alpha==null?1:alpha;
  // soft drop shadow for depth
  for(const c of cells){
    const p=axialToPixel(c[0],c[1],size);
    drawCellHex(cx+p.x, cy+p.y, size, shade(color,-0.28), null);
  }
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = alpha==null?1:alpha;
  for(const c of cells){
    const p=axialToPixel(c[0],c[1],size);
    drawCellHex(cx+p.x, cy+p.y-size*0.07, size, color, shade(color,0.30), Math.max(1,size*0.05));
  }
  if(highlight){
    ctx.globalAlpha=1;
    for(const c of cells){
      const p=axialToPixel(c[0],c[1],size);
      drawCellHex(cx+p.x, cy+p.y-size*0.07, size, null, highlight, Math.max(2,size*0.12));
    }
  }
  ctx.restore();
}

// red overlay on a single board cell (used for overlap flash + bad preview cells)
function markCellRed(q, r, alpha){
  const p=axialToPixel(q,r,boardSize);   // drawn inside the rotated board frame (origin at centre)
  if(alpha){ ctx.globalAlpha=alpha; drawCellHex(p.x, p.y-boardSize*0.07, boardSize, '#e5533c', null); }
  ctx.globalAlpha=1; drawCellHex(p.x, p.y-boardSize*0.07, boardSize, null, '#ff2a1a', Math.max(2,boardSize*0.12));
}
// the grippable knurled ring around the board (drawn inside the rotated frame so it spins)
function drawBorder(hot){
  ctx.save();
  ctx.beginPath();
  ctx.arc(0,0,borderOuter,0,2*Math.PI);
  ctx.arc(0,0,borderInner,0,2*Math.PI,true);
  ctx.fillStyle = hot? '#3a4152' : '#2b2f39';
  ctx.fill('evenodd');
  ctx.lineWidth=Math.max(1.5,boardSize*0.06); ctx.strokeStyle = hot? '#5b6478' : '#3a3f4b';
  ctx.beginPath(); ctx.arc(0,0,borderOuter,0,2*Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,borderInner,0,2*Math.PI); ctx.stroke();
  // radial knurl ticks — they move as the board turns, showing the rotation
  ctx.lineWidth=Math.max(1.5,boardSize*0.07); ctx.strokeStyle = hot? '#b3bccd' : '#565d6d';
  const N=24;
  for(let i=0;i<N;i++){ const a=i/N*2*Math.PI, c=Math.cos(a), s=Math.sin(a);
    ctx.beginPath(); ctx.moveTo(borderInner*c, borderInner*s); ctx.lineTo(borderOuter*c, borderOuter*s); ctx.stroke(); }
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);

  // board, grip ring and placed pieces all render in the rotated board frame
  ctx.save();
  ctx.translate(boardOx, boardOy);
  ctx.rotate(boardAngle);

  drawBorder(!!boardDrag);

  // board empty cells
  for(const [q,r] of boardCells){
    const p=axialToPixel(q,r,boardSize);
    drawCellHex(p.x, p.y, boardSize, '#20232b', '#333846', Math.max(1,boardSize*0.04));
  }

  // placed pieces (overlaps allowed — they just stack)
  pieces.forEach((p,idx)=>{
    if(!p.placed || (drag && drag.idx===idx)) return;
    drawPieceHexes(placedCells(p), 0, 0, boardSize, p.color, 1, selected===idx?'#ffffff':null);
  });

  // flash every cell where two or more pieces intersect
  if(overlapCells.size){
    const pulse=0.30+0.45*(0.5+0.5*Math.sin(Date.now()/160));
    ctx.save();
    for(const k of overlapCells){ const [q,r]=k.split(',').map(Number); markCellRed(q,r,pulse); }
    ctx.restore();
  }

  // dragging piece snapped onto the board (preview)
  if(drag && drag.snapCell){
    const p=pieces[drag.idx];
    const cells = orientedOffsets(p).map(o=>[drag.snapCell.q+o[0], drag.snapCell.r+o[1]]);
    drawPieceHexes(cells, 0, 0, boardSize, p.color, drag.valid?0.95:0.6, '#ffffff');
    // outline cells that would overlap an existing piece (off-board overhang is allowed)
    ctx.save();
    for(const c of cells){ const k=c[0]+','+c[1];
      if(cover.has(k)) markCellRed(c[0],c[1],0); }
    ctx.restore();
  }
  ctx.restore();

  // tray pieces
  pieces.forEach((p,idx)=>{
    if(p.placed || (drag && drag.idx===idx)) return;
    drawPieceHexes(orientedOffsets(p), p.tray.x, p.tray.y, traySize, p.color, 1, selected===idx?'#ffffff':null);
  });

  // free-floating dragging piece (off the board, drawn last on top)
  if(drag && !drag.snapCell){
    const p=pieces[drag.idx];
    drawPieceHexes(orientedOffsets(p), drag.mx, drag.my, boardSize*0.9, p.color, 0.95, '#ffffff');
  }
}
// keep the overlap cells pulsing while any intersection exists
function flashLoop(){ flashRAF=null; draw(); if(overlapCells.size) flashRAF=requestAnimationFrame(flashLoop); }
function startFlash(){ if(flashRAF==null) flashRAF=requestAnimationFrame(flashLoop); }
function stopFlash(){ if(flashRAF!=null){ cancelAnimationFrame(flashRAF); flashRAF=null; } }

/* ---------- interaction ---------- */
function evtPos(e){
  const rect=canvas.getBoundingClientRect();
  const t = e.touches? e.touches[0] : e;
  return { x:t.clientX-rect.left, y:t.clientY-rect.top };
}
function rotatePt(x,y,ang){ const c=Math.cos(ang), s=Math.sin(ang); return {x:x*c-y*s, y:x*s+y*c}; }
// screen pixel -> board axial cell, undoing the whole-board rotation
function screenToBoardCell(x,y){ const p=rotatePt(x-boardOx, y-boardOy, -boardAngle); return pixelToAxial(p.x, p.y, boardSize); }
// find piece under a point. Returns {idx, kind:'board'|'tray'} or null
function pick(px,py){
  // check dragging-priority: placed pieces on board first if over board, else tray
  // tray pieces
  for(let i=pieces.length-1;i>=0;i--){
    const p=pieces[i];
    if(p.placed) continue;
    const offs=orientedOffsets(p);
    const local=pixelToAxial(px-p.tray.x, py-p.tray.y, traySize);
    if(offs.some(o=>o[0]===local.q&&o[1]===local.r)) return {idx:i,kind:'tray'};
  }
  // placed pieces — return the topmost (last-drawn) piece covering this cell
  const cell=screenToBoardCell(px, py);
  const a=cover.get(cell.q+","+cell.r);
  if(a && a.length) return {idx:Math.max(...a), kind:'board'};
  return null;
}

// rebuild the cell->pieces coverage map and the set of overlapping cells
function recompute(){
  cover.clear();
  pieces.forEach((p,idx)=>{
    if(!p.placed) return;
    for(const c of placedCells(p)){
      const k=c[0]+","+c[1];
      let a=cover.get(k); if(!a){ a=[]; cover.set(k,a); }
      a.push(idx);
    }
  });
  overlapCells.clear();
  for(const [k,a] of cover) if(a.length>1) overlapCells.add(k);
  if(overlapCells.size) startFlash(); else stopFlash();
}
function removeFromBoard(idx){
  const p=pieces[idx];
  if(!p.placed) return;
  p.placed=false; p.anchor=null;
  recompute();
}
// place anywhere on the board (overlaps allowed); only refuses to hang off the board
function placeAt(idx, cellQ, cellR){
  if(!validAt(idx, cellQ, cellR)) return false;
  pieces[idx].placed=true; pieces[idx].anchor={q:cellQ,r:cellR};
  recompute();
  return true;
}
// valid == at least ONE hex lands on the board (the rest may hang off the edge).
// Overlaps are ignored (allowed). A partly-on-board piece stays at full board size.
function validAt(idx, cellQ, cellR){
  const offs=orientedOffsets(pieces[idx]);
  return offs.some(o=>boardSet.has((cellQ+o[0])+","+(cellR+o[1])));
}

function onDown(e){
  if(solvedFlag) return;
  const {x,y}=evtPos(e);
  const hit=pick(x,y);
  if(!hit){
    // grabbed the grip ring (and not a piece)? -> start turning the whole board
    const d=Math.hypot(x-boardOx, y-boardOy);
    if(d>=borderInner-4 && d<=borderOuter+4){
      boardDrag={lastAng:Math.atan2(y-boardOy, x-boardOx)};
      selected=-1; draw(); e.preventDefault(); return;
    }
    selected=-1; draw(); return;
  }
  if(startTime===null) startTime=Date.now();
  const idx=hit.idx, p=pieces[idx];
  selected=idx;
  const wasPlaced=p.placed;
  const origAnchor=wasPlaced?{q:p.anchor.q,r:p.anchor.r}:null;
  // work out which hexagon of the piece was grabbed + its fixed pivot, so a tap can
  // rotate/flip the piece AROUND that hexagon (keeping it pinned in place)
  const offs=orientedOffsets(p);
  let clickIdx=0, pivotCell=null, pivotPx=null;
  if(hit.kind==='board'){
    const c=screenToBoardCell(x, y);
    clickIdx=offs.findIndex(o=>o[0]===c.q-origAnchor.q && o[1]===c.r-origAnchor.r);
    pivotCell={q:c.q, r:c.r};
  } else {
    const c=pixelToAxial(x-p.tray.x, y-p.tray.y, traySize);
    clickIdx=offs.findIndex(o=>o[0]===c.q && o[1]===c.r);
    const cp=axialToPixel(c.q, c.r, traySize);
    pivotPx={x:p.tray.x+cp.x, y:p.tray.y+cp.y};
  }
  if(clickIdx<0) clickIdx=0;
  if(hit.kind==='board') removeFromBoard(idx);
  // anchor grab: keep piece under cursor, cell[0] follows pointer
  drag={idx, mx:x, my:y, snapCell:null, valid:false, moved:false, downX:x, downY:y,
        wasPlaced, origAnchor, clickIdx, pivotCell, pivotPx};
  updateSnap();
  draw();
  e.preventDefault();
}
function onMove(e){
  if(boardDrag){
    const {x,y}=evtPos(e);
    const ang=Math.atan2(y-boardOy, x-boardOx);
    let d=ang-boardDrag.lastAng; while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI;
    boardAngle+=d; boardDrag.lastAng=ang;
    draw(); e.preventDefault(); return;
  }
  if(!drag) return;
  const {x,y}=evtPos(e);
  if(Math.hypot(x-drag.downX,y-drag.downY)>8) drag.moved=true;
  drag.mx=x; drag.my=y;
  updateSnap();
  draw();
  e.preventDefault();
}
function updateSnap(){
  // snap the grabbed cell to the board grid whenever any hex would land on the board
  // (or the pointer is hovering it) — a single on-board hex is enough to place at board size
  const cell=screenToBoardCell(drag.mx, drag.my);
  const valid=validAt(drag.idx, cell.q, cell.r);   // at least one hex on the board
  const near = boardSet.has(cell.q+","+cell.r) ||
     Math.hypot(drag.mx-boardOx, drag.my-boardOy) < boardCircumR*1.1;
  if(valid || near){
    drag.snapCell={q:cell.q,r:cell.r};
    drag.valid=valid;
  } else {
    drag.snapCell=null; drag.valid=false;
  }
}
function onUp(e){
  if(boardDrag){ boardDrag=null; draw(); e && e.preventDefault(); return; }
  if(!drag) return;
  const idx=drag.idx, p=pieces[idx];
  if(!drag.moved){
    const now=Date.now();
    if(lastTap && now-lastTap.t<320 && lastTap.idx===idx){
      // second tap of a double-click(-tap) on the same piece -> flip it
      // (undo the +1 the first tap applied, so a double is a pure flip, no net rotation)
      p.rot=(p.rot+5)%6;
      p.flip=!p.flip;
      lastTap=null;
    } else {
      // single tap rotates the piece in place
      p.rot=(p.rot+1)%6;
      lastTap={t:now, idx};
    }
    // pivot around the grabbed hexagon: keep that cell pinned where it was
    const co=orientedOffsets(p)[drag.clickIdx];
    if(drag.wasPlaced){
      // re-place so the clicked board cell is unchanged; if the rest runs off-board, free-drop near cursor
      if(!placeAt(idx, drag.pivotCell.q-co[0], drag.pivotCell.r-co[1])){
        const cp=axialToPixel(co[0],co[1],traySize);
        p.tray.x=drag.mx-cp.x; p.tray.y=drag.my-cp.y;
      }
    } else {
      const cp=axialToPixel(co[0],co[1],traySize);
      p.tray.x=drag.pivotPx.x-cp.x; p.tray.y=drag.pivotPx.y-cp.y;
    }
  } else if(drag.snapCell && drag.valid){
    placeAt(idx, drag.snapCell.q, drag.snapCell.r);   // overlaps allowed; only off-board is refused
  } else {
    // dropped off the board -> leave it right where it was released (free scatter)
    p.placed=false; p.anchor=null;
    p.tray.x=drag.mx; p.tray.y=drag.my;
  }
  drag=null;
  recompute();
  updateCount();
  checkWin();
  draw();
  e && e.preventDefault();
}

/* rotate the active piece (dragging or selected) */
function activeIdx(){ return drag? drag.idx : selected; }
function rotateActive(dir){
  const i=activeIdx(); if(i<0) return;
  const p=pieces[i];
  const wasPlaced=p.placed;
  const anchor=wasPlaced?{q:p.anchor.q, r:p.anchor.r}:null;
  if(wasPlaced) removeFromBoard(i);
  p.rot=((p.rot + (dir>0?1:5))%6);
  // keep it on the board at the same spot if it still fits, else drop to tray
  if(wasPlaced) placeAt(i, anchor.q, anchor.r);
  if(drag) updateSnap();
  updateCount();
  draw();
}

/* ---------- buttons & win ---------- */
function updateCount(){
  const n=pieces.filter(p=>p.placed).length;
  document.getElementById('count').textContent=n;
  document.getElementById('total').textContent=pieces.length;
}
/* ---------- solution numbering & collection ---------- */
const TOTAL_SOLUTIONS = 817984;   // exact count of distinct fillings of this piece set
function cyrb53(str, seed){        // fast 53-bit string hash
  let h1=0xdeadbeef^(seed||0), h2=0x41c6ce57^(seed||0);
  for(let i=0,ch;i<str.length;i++){ ch=str.charCodeAt(i);
    h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507); h1^=Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507); h2^=Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
function solutionKey(){ // stable string: which piece fills each board cell (one per cell when solved)
  return boardCells.map(([q,r])=>{ const a=cover.get(q+","+r); return a&&a.length? pieces[a[0]].id : '_'; }).join('|');
}
function currentLayout(){ return pieces.map(p=>({color:p.color, cells:placedCells(p)})); }
function loadCollection(){ try{ return JSON.parse(localStorage.getItem('hexSolvedV1')||'{}'); }catch(e){ return {}; } }
function saveCollection(c){ try{ localStorage.setItem('hexSolvedV1', JSON.stringify(c)); }catch(e){} }
function updateSolCount(){ document.getElementById('solCount').textContent=Object.keys(loadCollection()).length; }

function checkWin(){
  // solved == every board cell covered exactly once, nothing overlapping or hanging off-board
  let allOnBoard=true; for(const k of cover.keys()) if(!boardSet.has(k)){ allOnBoard=false; break; }
  if(overlapCells.size===0 && allOnBoard && cover.size===boardCells.length && pieces.every(p=>p.placed)){
    solvedFlag=true;
    const secs=startTime?Math.round((Date.now()-startTime)/1000):0;
    const mm=String(Math.floor(secs/60)).padStart(2,'0'), ss=String(secs%60).padStart(2,'0');
    // assign this exact filling its solution number
    const h=cyrb53(solutionKey());
    const id=h.toString(36);
    const num=(h % TOTAL_SOLUTIONS)+1;
    const layout=currentLayout();
    const col=loadCollection();
    const isNew=!(id in col);
    const approved=approvedNames[id];   // {name,...} if this exact solution has an approved name
    if(isNew){ col[id]={num, date:Date.now(), layout}; }
    if(approved) col[id] && (col[id].name=approved.name);
    saveCollection(col);
    const found=Object.keys(col).length;
    document.getElementById('badge').innerHTML=
      '<div class="lab">Solution</div>'+
      '<div class="num">#'+num.toLocaleString()+' <small>of '+TOTAL_SOLUTIONS.toLocaleString()+'</small></div>'+
      '<span class="tag '+(isNew?'new':'old')+'">'+(isNew?'★ New find!':'Already collected')+'</span>';
    document.getElementById('wintime').textContent=
      'Solved in '+mm+':'+ss+' · your collection: '+found+' of '+TOTAL_SOLUTIONS.toLocaleString()+'.';
    renderNaming(id, num, layout, approved);
    updateSolCount();
    document.getElementById('win').style.display='flex';
  }
}

let pendingSubmit=null;   // {id,num,layout} for the current solved board
function renderNaming(id, num, layout, approved){
  const nameEl=document.getElementById('approvedName');
  const submitEl=document.getElementById('nameSubmit');
  const msg=document.getElementById('nameMsg');
  msg.textContent=''; msg.className='';
  if(approved){
    // this solution already has an owner-approved name → show it, hide the form
    nameEl.innerHTML='This solution is known as <b>“'+escapeHtml(approved.name)+'”</b>';
    nameEl.style.display='';
    submitEl.style.display='none';
    pendingSubmit=null;
  } else {
    nameEl.style.display='none';
    submitEl.style.display='';
    document.getElementById('nameInput').value='';
    document.getElementById('submitName').disabled=false;
    pendingSubmit={id, num, layout};
  }
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* render one saved solution as a mini hexagon */
function drawSolMini(canvas, layout){
  const R=9, pad=3;
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9; const cells=[];
  layout.forEach(pc=>pc.cells.forEach(([q,r])=>{
    const x=R*SQRT3*(q+r/2), y=R*1.5*r; cells.push({x,y,color:pc.color});
    minx=Math.min(minx,x-R);maxx=Math.max(maxx,x+R);miny=Math.min(miny,y-R);maxy=Math.max(maxy,y+R);
  }));
  const w=Math.ceil(maxx-minx)+pad*2, hh=Math.ceil(maxy-miny)+pad*2;
  const DPR=Math.min(window.devicePixelRatio||1,2);
  canvas.width=w*DPR; canvas.height=hh*DPR; canvas.style.width=w+'px'; canvas.style.height=hh+'px';
  const c=canvas.getContext('2d'); c.setTransform(DPR,0,0,DPR,0,0);
  cells.forEach(cell=>{
    c.beginPath();
    for(let i=0;i<6;i++){ const a=Math.PI/180*(30+60*i);
      const x=cell.x-minx+pad+R*0.96*Math.cos(a), y=cell.y-miny+pad+R*0.96*Math.sin(a);
      if(i===0)c.moveTo(x,y); else c.lineTo(x,y); }
    c.closePath(); c.fillStyle=cell.color; c.fill();
    c.lineWidth=0.6; c.strokeStyle='rgba(255,255,255,.45)'; c.stroke();
  });
}
async function openCollection(){
  await loadApprovedNames();            // pull the latest approved names before rendering
  const col=loadCollection();
  const entries=Object.entries(col).sort((a,b)=>b[1].date-a[1].date);
  document.getElementById('colSub').textContent=entries.length+' found · '+TOTAL_SOLUTIONS.toLocaleString()+' total';
  const g=document.getElementById('gallery'); g.innerHTML='';
  if(!entries.length){ g.innerHTML='<div class="empty">No solutions yet — solve the puzzle to start your collection!</div>'; }
  entries.forEach(([id,rec])=>{
    const name=(approvedNames[id] && approvedNames[id].name) || rec.name;
    const d=document.createElement('div'); d.className='sol';
    const cv=document.createElement('canvas'); d.appendChild(cv);
    const sn=document.createElement('div'); sn.className='sn'; sn.textContent='#'+rec.num.toLocaleString(); d.appendChild(sn);
    if(name){ const nm=document.createElement('div'); nm.className='sname'; nm.textContent='“'+name+'”'; nm.title=name; d.appendChild(nm); }
    const sd=document.createElement('div'); sd.className='sd'; sd.textContent=new Date(rec.date).toLocaleDateString(); d.appendChild(sd);
    g.appendChild(d); drawSolMini(cv, rec.layout);
  });
  document.getElementById('collection').style.display='flex';
}
function newGame(shuffleOnly){
  document.getElementById('win').style.display='none';
  solvedFlag=false; startTime=null; selected=-1; drag=null; boardDrag=null; boardAngle=0;
  if(!shuffleOnly) makePieces();
  else for(const p of pieces){ p.placed=false; p.anchor=null; }
  for(const p of pieces){
    p.rot=Math.floor(Math.random()*6);
    p.flip=false;
  }
  recompute();
  layoutTray();
  updateCount(); draw();
}
function solveAll(){
  document.getElementById('win').style.display='none';
  for(const p of pieces){
    p.rot=0; p.flip=false;
    // solution cells are absolute; with rot0/flip false, orientedOffsets == base - base[0]
    p.anchor={q:p.base[0][0], r:p.base[0][1]}; p.placed=true;
  }
  recompute();
  selected=-1;
  updateCount();
  draw(); // reveal solution without firing the win congratulation
}

document.getElementById('rotL').onclick=()=>rotateActive(-1);
document.getElementById('rotR').onclick=()=>rotateActive(1);
document.getElementById('shuffle').onclick=()=>newGame(true);
document.getElementById('reset').onclick=()=>newGame(true);
document.getElementById('solve').onclick=solveAll;
document.getElementById('again').onclick=()=>newGame(true);
document.getElementById('solutions').onclick=openCollection;
document.getElementById('viewAll').onclick=openCollection;
document.getElementById('colClose').onclick=()=>document.getElementById('collection').style.display='none';
document.getElementById('submitName').onclick=()=>{
  if(!pendingSubmit) return;
  const input=document.getElementById('nameInput');
  const msg=document.getElementById('nameMsg');
  const name=input.value.trim();
  if(name.length<2){ msg.textContent='Please enter a name (at least 2 characters).'; msg.className=''; return; }
  submitNameForApproval(pendingSubmit.id, pendingSubmit.num, name, pendingSubmit.layout);
  msg.textContent='Opening GitHub to submit “'+name+'” for approval…';
  msg.className='ok';
  document.getElementById('submitName').disabled=true;
};
document.getElementById('nameInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); document.getElementById('submitName').click(); }
});

window.addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'||e.key==='ArrowRight') { rotateActive(1); }
  else if(e.key==='e'||e.key==='E'||e.key==='ArrowLeft'){ rotateActive(-1); }
});
canvas.addEventListener('mousedown',onDown);
window.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
canvas.addEventListener('contextmenu',e=>{ e.preventDefault(); rotateActive(1); });
canvas.addEventListener('touchstart',onDown,{passive:false});
canvas.addEventListener('touchmove',onMove,{passive:false});
canvas.addEventListener('touchend',onUp,{passive:false});

window.addEventListener('resize',resize);
makePieces();
newGame(true);
resize();
updateSolCount();
loadApprovedNames();   // fetch the published approved names (async, non-blocking)
</script>
